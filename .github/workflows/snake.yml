name: Generate Snake Animation

on:
  schedule:
    - cron: "0 6 * * *"   # se ejecuta todos los días a las 6:00 UTC
  workflow_dispatch: {}    # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main              # se regenera cada vez que haces push a main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Carla170
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
